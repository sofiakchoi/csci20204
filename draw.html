<body>
    
        <h1 onclick="location.href='index.html'"><svg xmlns="http://www.w3.org/2000/svg" width="60" height="auto"
                fill="#0909aa" class="bi bi-eye" viewBox="0 0 16 16">
                <path
                    d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z" />
                <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0" />
            </svg><br><span id="count"></span></h1>
            
        <div class="canvas">
            <canvas id="drawhere"></canvas>
            <div id="toolbar">
                <div class="container text-center">
                    <button id="save">Save</button>
                    <button id="clear">Refresh</button>
                </div>
                <br>
                <div class="container text-center">
                    <label for="stroke">Color</label>
                    <input id="stroke" name="strokeColor" type="color">
                    <label for="lineWidth">Weight</label>
                    <input id="lineWidth" name="lineWidth" type="number" value="3">
                </div>
            </div>
        </div>
    
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
